name = "fortad"
version = "0.1.0"
description = "Source-transformation automatic differentiation for Fortran"
author = "krystophny"
license = "MIT"

[dependencies]
fortfront = { path = "../fortfront" }
fortgen = { path = "../fortgen" }

[build]
auto-examples = false

[fortran]
implicit-external = false
implicit-typing = false
source-form = "free"

# The Taylor oracle compiles these sources at run time in its isolated view.
[[extra.fo.inputs]]
path = "src/fortad_kinds.f90"
kind = "file"
role = "test-fixture"

[[extra.fo.inputs]]
path = "src/fortad_taylor.f90"
kind = "file"
role = "test-fixture"
