name = "fortad"
version = "0.2.0"
description = "Source-transformation automatic differentiation for Fortran"
author = "krystophny"
license = "MIT"

[dependencies]
fortfront = { git = "https://github.com/lazy-fortran/fortfront.git", rev = "2f198f338d2627c831fa6b00f63dc3eaef570b45" }
fortgen = { git = "https://github.com/lazy-fortran/fortgen.git", rev = "6212f007d5b1f7e900244acc07ba793654ed08c0" }

[build]
auto-examples = false

[fortran]
implicit-external = false
implicit-typing = false
source-form = "free"

# The Taylor oracle compiles these sources at run time in its isolated view.
[[extra.fo.inputs]]
path = "src/fortad_kinds.f90"
kind = "file"
role = "test-fixture"

[[extra.fo.inputs]]
path = "src/fortad_taylor.f90"
kind = "file"
role = "test-fixture"
