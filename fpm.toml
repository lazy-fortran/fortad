name = "fortad"
version = "0.1.0"
description = "Source-transformation automatic differentiation for Fortran"
author = "krystophny"
license = "MIT"

[dependencies]
fortfront = { git = "https://github.com/lazy-fortran/fortfront.git", rev = "a0a6e0ede1ff164e74e18b02eb6c1c4d23550817" }
fortgen = { git = "https://github.com/lazy-fortran/fortgen.git", rev = "6212f007d5b1f7e900244acc07ba793654ed08c0" }

[build]
auto-examples = false

[fortran]
implicit-external = false
implicit-typing = false
source-form = "free"

# The Taylor oracle compiles these sources at run time in its isolated view.
[[extra.fo.inputs]]
path = "src/fortad_kinds.f90"
kind = "file"
role = "test-fixture"

[[extra.fo.inputs]]
path = "src/fortad_taylor.f90"
kind = "file"
role = "test-fixture"
