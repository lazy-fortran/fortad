# fortad upstream inspection baseline
#
# Every entry is a third-party project fortad studies. Nothing listed here is
# vendored, copied, or redistributed. `scripts/fetch_upstreams.py` clones each
# entry into the gitignored `upstream/` tree for local reading only.
#
# Fields
#   url        clone or download location
#   ref        pinned revision, tag, or branch used for inspection
#   license    SPDX identifier as declared upstream; VERIFY re-reads the
#              checked-out LICENSE file and records what it actually found
#   category   fortran-st | fortran-oo | llvm-ir | mlir | julia | python |
#              cpp-oo | cpp-st | symbolic | infra | corpus
#   level      the representation the tool differentiates
#   inspect    paths worth reading first
#   why        what fortad wants to learn from it
#   adapt      "none" (read-only study) or a description of any intended reuse.
#              Anything other than "none" requires a PROVENANCE.md row and a
#              licence-compatibility check before a line of code is written.

schema_version = 1

# ---------------------------------------------------------------------------
# Tier A - Fortran source-transformation AD. Direct prior art for fortad.
# ---------------------------------------------------------------------------

[[upstream]]
name = "tapenade"
url = "https://gitlab.inria.fr/tapenade/tapenade.git"
ref = "master"
license = "VERIFY-INRIA-custom"
category = "fortran-st"
level = "Fortran 77/90/95 and C AST (IL / Java implementation)"
inspect = ["src/", "doc/", "ADFirstAidKit/"]
why = """The reference source-transformation AD system. Tangent, adjoint,
tangent-of-adjoint, checkpointing on call graph, TBR and activity analysis,
differentiable-vs-required dataflow, adjoint of loops, message-passing adjoints.
Read the analyses, not the code."""
adapt = "none"

[[upstream]]
name = "openad"
url = "https://github.com/Argonne-National-Laboratory/OpenAD.git"
ref = "master"
license = "VERIFY"
category = "fortran-st"
level = "XAIF (XML language-independent AD IR), Fortran via Open64/mfef90"
inspect = ["xaifBooster/", "OpenADFortTk/"]
why = """The only fully open Fortran adjoint compiler with a documented
language-independent AD IR. xaifBooster carries the canonical implementations of
activity analysis, to-be-recorded (TBR) analysis, linearity analysis, basic-block
preaccumulation and cross-country elimination heuristics."""
adapt = "none"

[[upstream]]
name = "xaifbooster"
url = "https://github.com/Argonne-National-Laboratory/xaifBooster.git"
ref = "master"
license = "VERIFY"
category = "fortran-st"
level = "XAIF"
inspect = ["algorithms/BasicBlockPreaccumulation/", "algorithms/CrossCountryInterface/"]
why = "Vertex/edge/face elimination on the linearized computational graph."
adapt = "none"

[[upstream]]
name = "adifor-docs"
url = "https://www.mcs.anl.gov/research/projects/adifor/"
ref = "web"
license = "VERIFY-restricted"
category = "fortran-st"
level = "Fortran 77 source"
inspect = ["documentation only"]
why = """First widely deployed Fortran ST tool. SparsLinC sparse derivative
propagation and the seed-matrix/vector-mode design are the parts that matter.
Source distribution is registration-gated and restrictively licensed: fortad
studies the published papers and manuals only, never the source."""
adapt = "none"

[[upstream]]
name = "rapsodia"
url = "https://github.com/Argonne-National-Laboratory/Rapsodia.git"
ref = "master"
license = "VERIFY"
category = "fortran-st"
level = "generated Fortran/C++ Taylor-arithmetic libraries"
inspect = ["src/"]
why = """Code generation for higher-order univariate Taylor propagation with
fixed unrolled inner loops. The template for how fortad should emit higher-order
and Hessian kernels rather than nesting AD."""
adapt = "none"

[[upstream]]
name = "psyclone"
url = "https://github.com/stfc/PSyclone.git"
ref = "master"
license = "BSD-3-Clause"
category = "infra"
level = "fparser2 parse tree / PSyIR"
inspect = ["src/psyclone/psyir/", "src/psyclone/autodiff/"]
why = """A production Fortran source-to-source transformation framework with a
typed IR (PSyIR) and an adjoint (`psyad`) built on top of it. Closest structural
analogue to fortfront + fortad. Their PSyIR lowering rules and the psyad
tangent-linear/adjoint test methodology are directly instructive."""
adapt = "none"

# ---------------------------------------------------------------------------
# Tier B - Fortran operator-overloading AD. Baselines for correctness, not speed.
# ---------------------------------------------------------------------------

[[upstream]]
name = "dnad"
url = "https://github.com/joddlehod/dnad.git"
ref = "master"
license = "NONE-FOUND (verified 2026-08-04 at ca93275a8451)"
category = "fortran-oo"
level = "Fortran derived type (dual numbers)"
inspect = ["metadata only - see below"]
why = """Minimal forward-mode dual-number module; would be a correctness oracle
and the naive baseline. BUT: the checkout carries no licence file at all, so per
LEGAL.md §5 it is all-rights-reserved. Metadata and published description only.
Do not read `dnad.F90`, do not adapt it. The dual-number baseline fortad
benchmarks against is written from the mathematics instead."""
adapt = "none - unlicensed, study prohibited"

[[upstream]]
name = "fazang"
url = "https://github.com/yizhang-yiz/fazang.git"
ref = "master"
license = "VERIFY"
category = "fortran-oo"
level = "Fortran derived type + tape"
inspect = ["src/"]
why = "Reverse-mode taping in pure Fortran, modelled on Stan Math. Shows the cost of a tape in Fortran, which is the number fortad's tape-free adjoints must beat."
adapt = "none"

[[upstream]]
name = "auto_deriv"
url = "https://github.com/gasagna/AutoDiff.git"
ref = "master"
license = "VERIFY"
category = "fortran-oo"
level = "Fortran derived type"
inspect = ["src/"]
why = "Second reference implementation of forward-mode overloading in Fortran."
adapt = "none"

# ---------------------------------------------------------------------------
# Tier C - Compiler-IR AD. Enzyme is the performance target.
# ---------------------------------------------------------------------------

[[upstream]]
name = "enzyme"
url = "https://github.com/EnzymeAD/Enzyme.git"
ref = "main"
license = "VERIFY-Apache-2.0-LLVM-exception"
category = "llvm-ir"
level = "post-optimisation LLVM IR, and MLIR via EnzymeMLIR"
inspect = [
  "enzyme/Enzyme/ActivityAnalysis.cpp",
  "enzyme/Enzyme/TypeAnalysis/",
  "enzyme/Enzyme/AdjointGenerator.h",
  "enzyme/Enzyme/CacheUtility.cpp",
  "enzyme/Enzyme/DifferentialUseAnalysis.h",
  "enzyme/Enzyme/BlasDerivatives.td",
  "enzyme/Enzyme/InstructionDerivatives.td",
  "enzyme/MLIR/",
]
why = """The system to beat. What matters is precisely enumerating what Enzyme
gets from operating on optimised IR (post-inlining, post-LICM, post-SROA
activity), and what it loses that fortad gets for free from Fortran semantics
(intent, contiguity, shapes, aliasing rules, pure/elemental, array expressions).
The .td derivative tables are the model for fortad's rule registry format."""
adapt = "none"

[[upstream]]
name = "enzyme-jax"
url = "https://github.com/EnzymeAD/Enzyme-JAX.git"
ref = "main"
license = "VERIFY"
category = "mlir"
level = "StableHLO / MLIR"
inspect = ["src/enzyme_ad/jax/"]
why = "AD interleaved with high-level tensor optimisation passes. Evidence for the claim that AD placed above scalar IR beats AD placed at scalar IR."
adapt = "none"

[[upstream]]
name = "clad"
url = "https://github.com/vgvassilev/clad.git"
ref = "master"
license = "LGPL-2.1-or-later (VERIFY)"
category = "cpp-st"
level = "Clang AST, emits C++"
inspect = ["lib/Differentiator/", "include/clad/Differentiator/"]
why = """The strongest existing argument that AST-level AD can compete with
IR-level AD. Clad publishes head-to-head numbers against Enzyme and ADOL-C.
Its `ReverseModeVisitor`, tape-vs-recompute policy, and `custom_derivatives`
mechanism map almost one-to-one onto what fortad needs. LGPL: study only, and
keep the clean-room boundary explicit."""
adapt = "none"

[[upstream]]
name = "rust-std-autodiff"
url = "https://github.com/rust-lang/rust.git"
ref = "master"
license = "Apache-2.0 OR MIT"
category = "llvm-ir"
level = "rustc MIR -> LLVM IR via Enzyme"
inspect = ["compiler/rustc_builtin_macros/src/autodiff.rs", "compiler/rustc_codegen_llvm/src/builder/autodiff.rs"]
why = "How a typed front-end language hands activity and type information down to Enzyme. Exactly the information fortad would instead consume itself."
adapt = "none"

# ---------------------------------------------------------------------------
# Tier D - Julia. Source-level AD on a typed SSA IR: the closest working model
# for what fortad wants to be.
# ---------------------------------------------------------------------------

[[upstream]]
name = "zygote"
url = "https://github.com/FluxML/Zygote.jl.git"
ref = "master"
license = "MIT"
category = "julia"
level = "Julia typed SSA IR (IRTools)"
inspect = ["src/compiler/reverse.jl", "src/compiler/interface2.jl"]
why = """The canonical published `source-to-source reverse mode on SSA` design
(Innes 2018/2019). Its treatment of control flow via stacked block arguments,
and its failure modes with mutation, are the two lessons fortad must absorb:
Fortran is mutation-first, so a Zygote-style pure-SSA adjoint cannot be copied."""
adapt = "none"

[[upstream]]
name = "mooncake"
url = "https://github.com/chalk-lab/Mooncake.jl.git"
ref = "main"
license = "MIT"
category = "julia"
level = "Julia typed SSA IR"
inspect = ["src/interpreter/", "src/rrules/"]
why = "Current-generation Julia reverse mode: handles mutation, uses a typed tape with pre-allocated storage. Directly relevant to Fortran's mutation-heavy code."
adapt = "none"

[[upstream]]
name = "enzyme-jl"
url = "https://github.com/EnzymeAD/Enzyme.jl.git"
ref = "main"
license = "MIT"
category = "julia"
level = "LLVM IR"
inspect = ["src/"]
why = "Enzyme's own front-end integration surface: activity annotations, batched/vector mode (`BatchDuplicated`), custom rules via EnzymeRules."
adapt = "none"

[[upstream]]
name = "chainrules"
url = "https://github.com/JuliaDiff/ChainRules.jl.git"
ref = "main"
license = "MIT"
category = "julia"
level = "rule registry"
inspect = ["src/rulesets/"]
why = """The best-designed AD rule registry in existence: frule/rrule separation,
thunks for lazily-evaluated adjoints, projection back to the primal type,
`@opt_out`. fortad's rule registry format should be judged against this."""
adapt = "none"

[[upstream]]
name = "forwarddiff"
url = "https://github.com/JuliaDiff/ForwardDiff.jl.git"
ref = "master"
license = "MIT"
category = "julia"
level = "operator overloading"
inspect = ["src/partials.jl", "src/apiutils.jl"]
why = "Chunked vector-forward mode: how many tangent directions to carry per primal sweep, and how chunk size interacts with SIMD width. Directly reusable design for fortad's vector mode."
adapt = "none"

[[upstream]]
name = "sparsediff"
url = "https://github.com/JuliaDiff/SparseMatrixColorings.jl.git"
ref = "main"
license = "MIT"
category = "julia"
level = "sparsity detection + coloring"
inspect = ["src/"]
why = "Modern implementation of star/acyclic coloring for compressed Jacobians and Hessians. The alternative to ColPack, with clearer code."
adapt = "none"

# ---------------------------------------------------------------------------
# Tier E - Python. Mostly tracing, but Tangent is the one true source-level one.
# ---------------------------------------------------------------------------

[[upstream]]
name = "tangent"
url = "https://github.com/google/tangent.git"
ref = "master"
license = "Apache-2.0"
category = "python"
level = "Python AST, emits readable Python"
inspect = ["tangent/reverse_ad.py", "tangent/forward_ad.py", "tangent/grads.py", "tangent/fence.py"]
why = """Archived, but the single closest precedent for fortad's product thesis:
AST-in, readable-source-out AD with a declarative rule table (`grads.py`) and
per-statement adjoint templates. Its `fence` (what the tool refuses) and its
stack-based data-flow reversal are worth reading line by line. Apache-2.0, so
adaptation is legally possible if it is ever worth it."""
adapt = "none"

[[upstream]]
name = "jax"
url = "https://github.com/jax-ml/jax.git"
ref = "main"
license = "Apache-2.0"
category = "python"
level = "jaxpr (typed trace IR) -> StableHLO"
inspect = ["jax/_src/interpreters/ad.py", "jax/_src/interpreters/partial_eval.py", "jax/_src/custom_derivatives.py"]
why = """The cleanest formulation of AD as composable program transformation:
JVP as a jaxpr-to-jaxpr map, transposition of the linear part to get VJP,
`linearize` = jvp + partial evaluation. This decomposition (JVP + transpose,
rather than a separate reverse-mode implementation) is the single most valuable
architectural idea available to fortad, and it halves the rule table."""
adapt = "none"

[[upstream]]
name = "autograd"
url = "https://github.com/HIPS/autograd.git"
ref = "master"
license = "MIT"
category = "python"
level = "runtime tracing"
inspect = ["autograd/core.py"]
why = "The minimal reference semantics of reverse mode. Useful as an executable specification when writing fortad's own semantics tests."
adapt = "none"

[[upstream]]
name = "pytorch"
url = "https://github.com/pytorch/pytorch.git"
ref = "main"
license = "BSD-3-Clause"
category = "python"
level = "runtime tape / torch.fx / dynamo"
inspect = ["tools/autograd/derivatives.yaml", "torch/csrc/autograd/"]
why = "`derivatives.yaml` is a mature declarative derivative-rule table with codegen. The format question fortad has to answer, already answered once at scale."
adapt = "none"

[[upstream]]
name = "casadi"
url = "https://github.com/casadi/casadi.git"
ref = "main"
license = "LGPL-3.0-or-later (VERIFY)"
category = "symbolic"
level = "symbolic expression graph -> generated C"
inspect = ["casadi/core/function_internal.cpp", "casadi/core/sparsity.cpp"]
why = """Symbolic AD with sparsity propagation and C code generation, used in
production optimal control. Its sparsity pattern algebra and `SX`/`MX` split
(scalar-graph vs matrix-graph) map onto fortad's choice between scalar-level and
array-level differentiation. LGPL: study only."""
adapt = "none"

[[upstream]]
name = "pyadjoint"
url = "https://github.com/dolfin-adjoint/pyadjoint.git"
ref = "master"
license = "LGPL-3.0 (VERIFY)"
category = "python"
level = "operator-level tape over PDE solves"
inspect = ["pyadjoint/tape.py", "pyadjoint/block.py"]
why = """The `differentiate the mathematics, not the loop` argument, and the
best worked example of checkpointing over time-stepping. This is where implicit
differentiation of solves beats any IR-level tool by orders of magnitude, and it
is fortad's structural advantage over Enzyme on real solver codes."""
adapt = "none"

